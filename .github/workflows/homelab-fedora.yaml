name: Fedora x86_64 maintenance package

on:
  push:
    branches: [codex/release-2.2.1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rpm:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the patched Pixelflux wheel
        run: |
          python3 -m venv "$RUNNER_TEMP/cibuildwheel"
          source "$RUNNER_TEMP/cibuildwheel/bin/activate"
          python3 -m pip install "cibuildwheel==4.3.5"
          bash scripts/ci/build-homelab-pixelflux.sh "$RUNNER_TEMP/selkies-wheels"
      - name: Build and verify the Fedora RPM
        run: bash scripts/ci/build-homelab-rpm.sh "$RUNNER_TEMP/selkies-wheels" out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selkies-2.2.1-homelab-fedora-x86_64
          path: |
            out/selkies-2.2.1-2.fc.homelab.x86_64.rpm
            out/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
